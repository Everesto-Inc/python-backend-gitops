# Apply on the control plane (Backstage has no cluster access):
#   sudo kubectl apply -f https://raw.githubusercontent.com/Everesto-Inc/python-backend-gitops/main/argocd/secret-stores.yaml
# needs secret infisical-python-backend-auth in namespace external-secrets
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-python-backend-dev
spec:
  conditions:
    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: dev-python } }
  provider:
    infisical:
      hostAPI: https://infisical.everesto.live
      auth:
        universalAuthCredentials:
          clientId: { name: infisical-python-backend-auth, namespace: external-secrets, key: clientId }
          clientSecret: { name: infisical-python-backend-auth, namespace: external-secrets, key: clientSecret }
      secretsScope: { projectSlug: python-backend-gitops-xv-fo, environmentSlug: dev, secretsPath: / }
