# All secrets of Infisical project "python-backend-gitops", env dev → Secret "python-backend"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: python-backend
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: infisical-python-backend-dev }
  target: { name: python-backend }
  dataFrom:
    - find: { name: { regexp: ".*" } }
